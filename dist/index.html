    <style>
    #game-container {
        position: relative;
    }
    
    .health-bar-container {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 220px;
        height: 28px;
        background: rgba(0, 0, 0, 0.8);
        border: 2px solid #444;
        border-radius: 6px;
        z-index: 100;
        pointer-events: none;
    }
    
    .health-bar-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #ff4444 0%, #ffaa00 50%, #44ff44 100%);
        border-radius: 4px;
        transition: width 0.15s ease-out;
    }
    
    .health-bar-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 14px;
        font-weight: bold;
        text-shadow: 2px 2px 4px black;
        z-index: 101;
        pointer-events: none;
    }
    
    .health-bar-container {
